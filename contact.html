        <main>
            <section id="reach-out">
                <h2>Contact Us</h2>
                <p>Please reach out to us with any questions or concerns. We are happy to help you plan your dream vacation with us!</p>
                <img src="images/swiss-peak.jpg" alt="Image of Swiss mountain with river flowing at the bottom.">
            </section>
            
            <form action="https://wp.zybooks.com/form-viewer.php" method="post">
                
                <label for="fullName">Full Name<span>*</span></label><br>
                <input type="text" id="fullName" name="fullName" required placeholder="Your full name"><br><br>
              
                <label for="email">Email Address<span>*</span></label><br>
                <input type="email" id="email" name="email" required placeholder="you@example.com"><br><br>
              
                <label for="phone">Phone Number<span>*</span></label><br>
                <input type="tel" name="phone" required pattern="^\d{10}$" placeholder="1234567890" title="Please enter a 10-digit phone number (numbers only)"><br><br>
              
                <p>Preferred Contact Method<span>*</span></p>
                <div class="radio-group">
                 <label class="radio-option">
                <input type="radio" name="preferredContact" value="email" required>
                <span class="custom-radio"></span>
                Email
                </label>
                <label class="radio-option">
                <input type="radio" name="preferredContact" value="phone" required>
                <span class="custom-radio"></span>
                Phone
            </label>
</div>
              
                <label for="comments">Comments<span>*</span></label><br>
                <textarea id="comments" name="comments" required placeholder="Your comments"></textarea><br><br>
              
                <input type="submit" value="Submit">
            </form>
        </main>
